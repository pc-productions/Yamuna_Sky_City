<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <!-- Placeholder mirroring the approved "Perfectly Connected" artwork
       (landscape, tower centered, radial landmark nodes with supplied
       travel times). Swap for the final exported image; data source of
       truth lives in content/location.ts. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6f5f1"/>
      <stop offset="100%" stop-color="#eceada"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- Radial geometry -->
  <g fill="none" stroke="#26469d" stroke-opacity="0.18" stroke-width="1">
    <circle cx="800" cy="470" r="180"/>
    <circle cx="800" cy="470" r="300"/>
    <circle cx="800" cy="470" r="420"/>
  </g>

  <!-- Tower silhouette -->
  <g fill="none" stroke="#26469d" stroke-width="2" stroke-opacity="0.55">
    <rect x="762" y="190" width="76" height="520"/>
    <line x1="762" y1="260" x2="838" y2="260"/>
    <line x1="762" y1="330" x2="838" y2="330"/>
    <line x1="762" y1="400" x2="838" y2="400"/>
    <line x1="762" y1="470" x2="838" y2="470"/>
    <line x1="762" y1="540" x2="838" y2="540"/>
    <line x1="762" y1="610" x2="838" y2="610"/>
  </g>

  <!-- Connectors -->
  <g stroke="#26469d" stroke-opacity="0.4" stroke-width="1">
    <line x1="800" y1="470" x2="520" y2="200"/>
    <line x1="800" y1="470" x2="1080" y2="200"/>
    <line x1="800" y1="470" x2="420" y2="470"/>
    <line x1="800" y1="470" x2="1180" y2="470"/>
    <line x1="800" y1="470" x2="520" y2="730"/>
    <line x1="800" y1="470" x2="1080" y2="730"/>
    <line x1="800" y1="470" x2="800" y2="790"/>
  </g>
  <g fill="#26469d">
    <circle cx="520" cy="200" r="5"/>
    <circle cx="1080" cy="200" r="5"/>
    <circle cx="420" cy="470" r="5"/>
    <circle cx="1180" cy="470" r="5"/>
    <circle cx="520" cy="730" r="5"/>
    <circle cx="1080" cy="730" r="5"/>
    <circle cx="800" cy="790" r="5"/>
    <circle cx="800" cy="470" r="8"/>
  </g>

  <!-- Landmark labels — data from content/location.ts (approved artwork) -->
  <g font-family="Arial, sans-serif" font-size="17" fill="#14161c">
    <g text-anchor="end">
      <text x="500" y="192">Beach</text>
      <text x="500" y="214" fill="#26469d" font-weight="bold">2 min</text>
      <text x="400" y="462">City Mall</text>
      <text x="400" y="484" fill="#26469d" font-weight="bold">8 min</text>
      <text x="500" y="722">A. J. Hospital</text>
      <text x="500" y="744" fill="#26469d" font-weight="bold">7 min</text>
    </g>
    <g text-anchor="start">
      <text x="1100" y="192">National Highway 66</text>
      <text x="1100" y="214" fill="#26469d" font-weight="bold">5 min</text>
      <text x="1200" y="462">International School</text>
      <text x="1200" y="484" fill="#26469d" font-weight="bold">6 min</text>
      <text x="1100" y="722">City Centre</text>
      <text x="1100" y="744" fill="#26469d" font-weight="bold">15 min</text>
    </g>
    <g text-anchor="middle">
      <text x="800" y="826">Mangalore International Airport</text>
      <text x="800" y="848" fill="#26469d" font-weight="bold">20 min</text>
    </g>
  </g>

  <text x="800" y="130" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#14161c" letter-spacing="2">YAMUNA SKY CITY</text>
  <text x="800" y="886" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8a8d97" letter-spacing="4">PLACEHOLDER — FINAL ARTWORK PENDING</text>
</svg>
